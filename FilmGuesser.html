<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎬 Guess the Movie!</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    body {
      background-color: #121212;
      color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .game-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .poster-wrapper {
      width: 260px;
      height: 380px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      border: 3px solid #333;
      background-color: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(22px);
      transition: filter 0.5s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popShake {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.1) rotate(-6deg); }
      40% { transform: scale(1.1) rotate(6deg); }
      60% { transform: scale(1.1) rotate(-4deg); }
      80% { transform: scale(1.1) rotate(4deg); }
      100% { transform: scale(1.08) rotate(0deg); }
    }

    .win-anim {
      animation: popShake 0.7s ease-in-out forwards !important;
      filter: blur(0px) !important;
    }

    .revealed-img {
      filter: blur(0px) !important;
    }

    .hint-box {
      background-color: #2a2a2a;
      border-left: 4px solid #0d6efd;
      border-radius: 6px;
      min-height: 120px;
      color: #e0e0e0;
    }

    .badge-hint {
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4">

  <div class="container" style="max-width: 680px;">
    <div class="game-card p-4 text-center">
      
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold m-0">🎬 Guess the Movie</h2>
        <span class="fs-5 fw-semibold text-warning">Score: <span id="score">0</span></span>
      </div>

      <!-- Poster Viewport -->
      <div class="poster-wrapper mb-3">
        <img id="poster" class="poster-img" src="" alt="Movie Poster" />
      </div>

      <!-- Progressive Hints Display -->
      <div class="hint-box p-3 text-start mb-3">
        <h6 class="text-uppercase fw-bold small mb-2" style="color: #a0a0a0;">Hints Unlocked:</h6>
        <div id="hintContent">
          <p class="text-light opacity-75 fst-italic mb-0">No hints unlocked yet. Take a guess or click "Get Next Hint"!</p>
        </div>
      </div>

      <!-- Input and Controls -->
      <div class="row g-2 justify-content-center mb-3">
        <div class="col-8">
          <input
            type="text"
            id="guessInput"
            class="form-control form-control-lg bg-dark text-white border-secondary"
            placeholder="Type movie title..."
            autocomplete="off"
          />
        </div>
        <div class="col-auto">
          <button id="submitBtn" class="btn btn-primary btn-lg px-4">Guess</button>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-2 mb-2">
        <button id="hintBtn" class="btn btn-outline-info">💡 Get Next Hint (<span id="hintCount">1/3</span>)</button>
        <button id="giveUpBtn" class="btn btn-outline-danger">🏳️ Give Up &amp; Reveal</button>
        <button id="nextBtn" class="btn btn-success d-none">Next Movie ➔</button>
      </div>
      <div id="feedback" class="alert d-none mt-3 mb-0"></div>
    </div>
  </div>
  <script>
    const movies = [
      {
        title: "Interstellar",
        poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
        year: "2014",
        cast: "Matthew McConaughey, Anne Hathaway, Jessica Chastain",
        synopsis: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival."
      },
      {
        title: "Inception",
        poster: "https://image.tmdb.org/t/p/w500/oYuLE1311o2RScM1E1C2P72A39u.jpg",
        year: "2010",
        cast: "Leonardo DiCaprio, Joseph Gordon-Levitt, Elliot Page",
        synopsis: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea."
      },
      {
        title: "The Dark Knight",
        poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
        year: "2008",
        cast: "Christian Bale, Heath Ledger, Aaron Eckhart",
        synopsis: "When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest tests."
      },
      {
        title: "Bullet Train",
        poster: "https://www.nerdsandbeyond.com/wp-content/uploads/2022/07/Bullet-Train-Dolby-Cinema-Poster-1.jpg",
        year: "2022",
        cast: "Brad Pitt, Joey King, Aaron Taylor-Johnson",
        synopsis: "Five assassins aboard a swiftly-moving bullet train find out that their missions have something in common."
      },
      {
        title: "Blade Runner 2049",
        poster: "https://resizing.flixster.com/73VCeyfsM8UDQ0o7IjUIcXr7jd8=/ems.cHJkLWVtcy1hc3NldHMvbW92aWVzL2RlNzI0MGQyLTQ2ZTktNGMyYi05N2VmLTFjMDhiY2VlMDQ2Ni53ZWJw",
        year: "2017",
        cast: "Ryan Gosling, Harrison Ford, Ana de Armas",
        synopsis: "A young blade runner's discovery of a long-buried secret leads him to track down former blade runner Rick Deckard."
      },
      {
        title: "Tenet",
        poster: "https://i.ebayimg.com/images/g/bk0AAOSwvAReB-tZ/s-l1200.jpg",
        year: "2020",
        cast: "John David Washington, Robert Pattinson, Elizabeth Debicki",
        synopsis: "Armed with only one word, a protagonist journeys through a twilight world of international espionage on a mission that unfolds beyond real time."
      },
      {
        title: "The Odyssey",
        poster: "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/2e317a1c-f1ce-4a5f-90db-d88cc01db2d0/dm6p7io-d28aa82b-5e20-4100-8cd9-25fdc9f93ab6.png/v1/fill/w_1280,h_2027,q_80,strp/the_odyssey_poster_giatn_vs_hodiseus_4k__by_mrandrew7w7_dm6p7io-fullview.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MjAyNyIsInBhdGgiOiIvZi8yZTMxN2ExYy1mMWNlLTRhNWYtOTBkYi1kODhjYzAxZGIyZDAvZG02cDdpby1kMjhhYTgyYi01ZTIwLTQxMDAtOGNkOS0yNWZkYzlmOTNhYjYucG5nIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ._oZvcCjmIX8Q2sRjf-3iLkhGJey01SlHf6Xq9gbWeso",
        year: "2026",
        cast: "Matt Damon, Tom Holland, Anne Hathaway",
        synopsis: "After uncovering a mysterious artifact buried beneath the Lunar surface, a spacecraft is sent to Jupiter to find its origins."
      },
      {
        title: "Rogue One: A Star Wars Story",
        poster: "https://w0.peakpx.com/wallpaper/727/434/HD-wallpaper-rogue-one-2016-movie-poster-star-wars.jpg",
        year: "2016",
        cast: "Felicity Jones, Diego Luna, Alan Tudyk",
        synopsis: "The Rebel Alliance makes a risky move to steal the plans for the Death Star, setting up the epic saga to follow."
      },
      {
        title: "Obsession",
        poster: "Obsession.jpeg",
        year: "2026",
        cast: "Inde Naverrette, Geneviève Bujold, John Lithgow",
        synopsis: "A wealthy New Orleans businessman is haunted by the tragic deaths of his wife and daughter in a kidnapping plot."
      },
      {
        title: "Django Unchained",
        poster: "Django.jpg",
        year: "2012",
        cast: "Jamie Foxx, Christoph Waltz, Leonardo DiCaprio",
        synopsis: "With the help of a German bounty-hunter, a freed slave sets out to rescue his wife from a brutal plantation owner."
      },
      {
        title: "The Empire Strikes Back",
        poster: "Empire.jpeg",
        year: "1980",
        cast: "Mark Hamill, Harrison Ford, Carrie Fisher",
        synopsis: "After the Rebels are brutally overpowered by the Empire on the ice planet Hoth, Luke Skywalker begins Jedi training with Yoda."
      },
      {
        title: "Spider-Man: Across the Spider-Verse",
        poster: "SpiderMan",
        year: "2023",
        cast: "Shameik Moore, Hailee Steinfeld, Oscar Isaac",
        synopsis: "Miles Morales catapults across the Multiverse, where he encounters a team of Spider-People charged with protecting its very existence."
      },
      {
        title: "A Knight's Tale",
        poster: "KnightsTale",
        year: "2001",
        cast: "Heath Ledger, Paul Bettany, Rufus Sewell",
        synopsis: "After his master dies, a peasant squire, fueled by his desire for food and glory, creates a new identity for himself as a knight."
      },
      {
        title: "Oppenheimer",
        poster: "https://resizing.flixster.com/dV1vfa4w_dB4wzk7A_VzThWUWw8=/ems.cHJkLWVtcy1hc3NldHMvbW92aWVzLzEyZDMyYjZmLThmNzAtNDliNC1hMjFmLTA2ZWY4M2UyMjJhMi5qcGc=",
        year: "2023",
        cast: "Cillian Murphy, Emily Blunt, Robert Downey Jr.",
        synopsis: "The story of the American scientist and his pivotal role in the development of the atomic bomb."
      },
      {
        title: "Shaun of the Dead",
        poster: "Shaun.jpg",
        year: "2004",
        cast: "Simon Pegg, Nick Frost, Kate Ashfield",
        synopsis: "The uneventful, aimless lives of a London electronics salesman and his layabout roommate are disrupted by the zombie apocalypse."
      },
      {
        title: "Zombieland",
        poster: "Zombie.jpg",
        year: "2009",
        cast: "Jesse Eisenberg, Woody Harrelson, Emma Stone",
        synopsis: "A shy student, a gun-toting bruiser, and a pair of sisters join forces to survive in a post-apocalyptic world."
      },
      {
        title: "Project Hail Mary",
        poster: "hail-mary.jpeg",
        year: "2026",
        cast: "Ryan Gosling, Sandra Hüller, Milana Vayntrub",
        synopsis: "A lone astronaut wakes up on a spacecraft with amnesia and must figure out how to save Earth from an extinction-level event."
      },
      {
      {
        title: "John Wick",
        poster: "JohnWick",
        year: "2014",
        cast: "Keanu Reeves, Michael Nyqvist, Alfie Allen",
        synopsis: "An ex-hitman comes out of retirement to track down the gangsters that killed his dog and took his car."
      },
    ];

    let currentIdx = 0;
    let unplayedIndices = [];
    let hintStage = 0; // 0: None, 1: Year, 2: Cast, 3: Synopsis
    let score = 0;
    let isGameOver = false;
    let imageLoadTimer = null;

    // DOM Elements
    const poster = document.getElementById("poster");
    const hintContent = document.getElementById("hintContent");
    const hintCount = document.getElementById("hintCount");
    const guessInput = document.getElementById("guessInput");
    const submitBtn = document.getElementById("submitBtn");
    const hintBtn = document.getElementById("hintBtn");
    const giveUpBtn = document.getElementById("giveUpBtn");
    const nextBtn = document.getElementById("nextBtn");
    const feedback = document.getElementById("feedback");
    const scoreEl = document.getElementById("score");

    // Random non-repeating index generator
    function getNextRandomIndex() {
      if (unplayedIndices.length === 0) {
        unplayedIndices = Array.from({ length: movies.length }, (_, i) => i);
        // Fisher-Yates Shuffle
        for (let i = unplayedIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [unplayedIndices[i], unplayedIndices[j]] = [unplayedIndices[j], unplayedIndices[i]];
        }
      }
      return unplayedIndices.pop();
    }

    function loadMovie() {
      currentIdx = getNextRandomIndex();
      const movie = movies[currentIdx];
      hintStage = 0;
      isGameOver = false;

      // Reset Poster
      poster.className = "poster-img";
      
      // Clear any existing image timers
      clearTimeout(imageLoadTimer);

      // Handle failed or broken image loads automatically
      poster.onerror = handleImageError;
      poster.onload = () => clearTimeout(imageLoadTimer);

      // 4-second timeout in case image network request hangs indefinitely
      imageLoadTimer = setTimeout(() => {
        if (!poster.complete || poster.naturalWidth === 0) {
          handleImageError();
        }
      }, 4000);

      poster.src = movie.poster;

      // Reset Controls & Hints
      guessInput.value = "";
      guessInput.disabled = false;
      submitBtn.disabled = false;
      hintBtn.disabled = false;
      hintCount.textContent = "1/3";
      
      nextBtn.classList.add("d-none");
      giveUpBtn.classList.remove("d-none");
      hintBtn.classList.remove("d-none");
      feedback.className = "alert d-none";

      renderHints();
      guessInput.focus();
    }

    function handleImageError() {
      clearTimeout(imageLoadTimer);
      if (isGameOver) return;
      
      isGameOver = true;
      feedback.className = "alert alert-warning mt-3 mb-0";
      feedback.textContent = `⚠️ Poster failed to load for "${movies[currentIdx].title}". Automatically skipping...`;
      feedback.classList.remove("d-none");

      // Auto-skip after 1.5 seconds
      setTimeout(() => {
        loadMovie();
      }, 1500);
    }

    function renderHints() {
      const movie = movies[currentIdx];
      if (hintStage === 0) {
        hintContent.innerHTML = `<p class="text-light opacity-75 fst-italic mb-0">No hints unlocked yet. Click "Get Next Hint" or make a guess!</p>`;
        return;
      }

      let html = "";
      if (hintStage >= 1) {
        html += `<div class="mb-1 text-white"><span class="badge bg-primary badge-hint me-2">Hint 1 - Year</span> <strong>${movie.year}</strong></div>`;
      }
      if (hintStage >= 2) {
        html += `<div class="mb-1 text-white"><span class="badge bg-info text-dark badge-hint me-2">Hint 2 - Cast</span> ${movie.cast}</div>`;
      }
      if (hintStage >= 3) {
        html += `<div class="text-white"><span class="badge bg-warning text-dark badge-hint me-2">Hint 3 - Synopsis</span> ${movie.synopsis}</div>`;
      }
      hintContent.innerHTML = html;
    }

    function unlockNextHint() {
      if (hintStage < 3) {
        hintStage++;
        renderHints();
        if (hintStage === 3) {
          hintBtn.disabled = true;
          hintCount.textContent = "Max";
        } else {
          hintCount.textContent = `${hintStage + 1}/3`;
        }
      }
    }

    function triggerWin() {
      clearTimeout(imageLoadTimer);
      isGameOver = true;
      score += Math.max(10, 40 - (hintStage * 10));
      scoreEl.textContent = score;

      // Confetti Effect
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      // Poster Win Animation (Unblur + Scale Pop + Shake)
      poster.classList.add("win-anim");

      // Feedback & Controls
      feedback.className = "alert alert-success mt-3 mb-0";
      feedback.textContent = `🎉 Correct! It's "${movies[currentIdx].title}"!`;

      finishRound();
    }

    function triggerGiveUp() {
      clearTimeout(imageLoadTimer);
      isGameOver = true;
      poster.classList.add("revealed-img");

      feedback.className = "alert alert-danger mt-3 mb-0";
      feedback.textContent = `The movie was "${movies[currentIdx].title}".`;

      // Show all hints
      hintStage = 3;
      renderHints();

      finishRound();
    }

    function finishRound() {
      guessInput.disabled = true;
      submitBtn.disabled = true;
      hintBtn.classList.add("d-none");
      giveUpBtn.classList.add("d-none");
      nextBtn.classList.remove("d-none");
    }

    function checkGuess() {
      if (isGameOver) return;
      
      const userGuess = guessInput.value.trim().toLowerCase();
      const actualTitle = movies[currentIdx].title.toLowerCase();

      if (!userGuess) return;

      if (userGuess === actualTitle || (userGuess.length > 3 && actualTitle.includes(userGuess))) {
        triggerWin();
      } else {
        feedback.className = "alert alert-danger mt-3 mb-0";
        feedback.textContent = "❌ Incorrect guess! Unlocking next hint...";
        feedback.classList.remove("d-none");
        unlockNextHint();
      }
    }

    // Event Listeners
    submitBtn.addEventListener("click", checkGuess);
    hintBtn.addEventListener("click", unlockNextHint);
    giveUpBtn.addEventListener("click", triggerGiveUp);
    nextBtn.addEventListener("click", () => {
      loadMovie();
    });
    guessInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkGuess();
    });

    // Start Game
    loadMovie();
  </script>
</body>
</html>
